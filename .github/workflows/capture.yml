name: Capture poe.ninja economy

on:
  schedule:
    - cron: "7 * * * *"   # hourly, a few minutes past the hour (GitHub may start it a little late)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The "data" branch holds only the latest data files. It is rewritten as one commit each run,
      # so the repository never grows with history.
      - name: Fetch the data branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
          fi

      - name: Capture
        run: node scripts/capture.js --out data

      - name: Publish the data branch
        run: |
          cd data
          touch .nojekyll
          rm -rf .git
          git init -q -b data
          git config user.name "capture-bot"
          git config user.email "capture-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
